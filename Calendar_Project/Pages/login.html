<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../Css/style.css">
</head>
<body>
    <div class="auth-box">
        <h2>Đăng nhập</h2>
        <label>Username</label><input id="u" autocomplete="username">
        <label>Mật khẩu</label><input id="p" type="password" autocomplete="current-password">
        <div class="msg" id="msg"></div>
        <button id="btn" style="width:100%">Đăng nhập</button>
        <p>Bạn chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </div>
    <script src="../Scripts/app.js"></script>
    <script>
    if (getUser()) location.href = 'calendar.html';
    async function doLogin() {
      msg.textContent = '';
      try {
        const r = await api('POST', '/auth/login', { username: u.value, password: p.value });
        localStorage.setItem('user', JSON.stringify(r));
        location.href = 'calendar.html';
      } catch (e) { msg.textContent = e.message; }
    }
    btn.onclick = doLogin;
    p.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
